name: Release Omni Helm Chart

on:
  push:
    branches:
      - main
    paths:
      - 'Chart.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm & yq
        uses: azure/setup-helm@v5

      - name: Fetch Chart from OCI
        run: |
          # 1. Read the target version updated by Dependabot
          VERSION=$(yq '.dependencies[] | select(.name == "omni") | .version' Chart.yaml)
          echo "Syncing Omni version: $VERSION"

          # 2. Pull chart into the staging directory expected by chart-releaser
          mkdir -p .cr-release-packages
          helm pull oci://ghcr.io/siderolabs/charts/omni --version "$VERSION" -d .cr-release-packages

      - name: Run Chart Releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          skip_packaging: true # Uses the .tgz already placed in .cr-release-packages
          skip_existing: true  # Avoids failure if the release/tag was already published
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          latest_tag: "" # fix for v1.7.0 unbound variable bug
