---
name: Helm Template Diff

on:
  pull_request:
    paths:
      - 'Chart.yaml'

permissions:
  contents: read
  pull-requests: write

jobs:
  template-diff:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Helm & yq
        uses: azure/setup-helm@v5

      - name: Generate Template Diff
        id: diff
        run: |
          # Extract new version from the PR branch's Chart.yaml
          NEW_VER=$(yq '.dependencies[] | select(.name == "omni") | .version' Chart.yaml)

          # Extract old version from the target branch (main)
          OLD_VER=$(git show origin/${{ github.base_ref }}:Chart.yaml | yq '.dependencies[] | select(.name == "omni") | .version')

          echo "Comparing Omni ${OLD_VER} -> ${NEW_VER}"

          # Render both charts via Helm
          mkdir -p rendered
          helm template omni oci://ghcr.io/siderolabs/charts/omni --version "${OLD_VER}" > rendered/old.yaml
          helm template omni oci://ghcr.io/siderolabs/charts/omni --version "${NEW_VER}" > rendered/new.yaml

          # Generate unified diff
          diff -u rendered/old.yaml rendered/new.yaml > template.diff || true

          # Handle character limits (GitHub comments have a 65,536-character limit)
          if [ -s template.diff ]; then
            # Truncate if diff is huge to avoid API rejection
            head -c 60000 template.diff > truncated.diff
            if [ $(wc -c < template.diff) -gt 60000 ]; then
              echo -e "\n\n...[Diff truncated: exceeds GitHub comment character limit]..." >> truncated.diff
            fi
            HAS_DIFF=true
          else
            HAS_DIFF=false
          fi

          echo "old_ver=${OLD_VER}" >> $GITHUB_OUTPUT
          echo "new_ver=${NEW_VER}" >> $GITHUB_OUTPUT
          echo "has_diff=${HAS_DIFF}" >> $GITHUB_OUTPUT

      - name: Post Diff Comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          OLD_VER: ${{ steps.diff.outputs.old_ver }}
          NEW_VER: ${{ steps.diff.outputs.new_ver }}
          HAS_DIFF: ${{ steps.diff.outputs.has_diff }}
        run: |
          if [ "$HAS_DIFF" = "true" ]; then
            BODY=$(cat <<EOF
          ### 🔍 Helm Template Diff: \`${OLD_VER}\` ➡️ \`${NEW_VER}\`

          <details>
          <summary>Click to expand template diff</summary>

          \`\`\`diff
          $(cat truncated.diff)
          \`\`\`

          </details>
          EOF
          )
          else
            BODY="### 🔍 Helm Template Diff: \`${OLD_VER}\` ➡
